<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Rifa Gratis M 🔰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:#EAB308; --gold-light:#FDE68A; --gold-dark:#A16207;
      --orange:#F97316; --orange-light:#FDBA74; --orange-dark:#C2410C;
      --bg:#0a0a0f; --surface:#111118; --surface2:#1a1a24;
      --text:#F1F0FF; --text-muted:#9B9BAA;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    
    .login-box { background:var(--surface); border:1px solid rgba(234,179,8,.3); border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
    .form-input { background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.12); border-radius:12px; color:#fff; outline:none; }
    .form-input:focus { border-color:var(--gold-light); }
    
    .btn-primary { background:linear-gradient(135deg,#A16207,#F97316); color:#000; font-weight:800; border-radius:12px; }
    .btn-danger { background:rgba(239,68,68,.1); border:1.5px solid #ef4444; color:#ef4444; font-weight:800; border-radius:12px; }
    .btn-danger:active { background:#ef4444; color:#fff; }

    .order-card { background:var(--surface2); border:1px solid rgba(255,255,255,.08); border-radius:18px; margin-bottom:12px; transition:transform .2s; }
    .status-badge { font-size:10px; font-weight:900; padding:3px 8px; border-radius:6px; text-transform:uppercase; }
    
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); z-index:500; display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal-card { background:var(--surface); border:1px solid rgba(234,179,8,.3); border-radius:24px; width:100%; max-width:400px; }
    
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:12px 20px; font-weight:700; z-index:9999; }
  </style>
</head>
<body class="p-4">

<div id="loginSection" class="max-w-sm mx-auto mt-20 login-box p-8">
  <div class="text-center mb-6">
    <div class="text-4xl mb-2">🔐</div>
    <h1 class="text-2xl font-black text-white">Panel Admin</h1>
    <p class="text-sm text-gray-400">Rifa Gratis M</p>
  </div>
  <input type="password" id="adminPass" class="form-input w-full p-4 text-center text-xl tracking-widest mb-4" placeholder="••••••" />
  <button onclick="checkLogin()" class="btn-primary w-full py-4">ENTRAR</button>
</div>

<div id="adminDashboard" class="hidden max-w-2xl mx-auto">
  <header class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-black text-white">Pedidos 📩</h1>
      <p class="text-sm text-gray-400" id="statsInfo">Cargando...</p>
    </div>
    <div class="flex gap-2">
      <button onclick="abrirAjustes()" class="p-3 bg-white/5 rounded-xl border border-white/10" title="Ajustes">⚙️</button>
      <button onclick="location.reload()" class="p-3 bg-white/5 rounded-xl border border-white/10">🔄</button>
    </div>
  </header>

  <div id="ordersList" class="space-y-4">
    <div class="text-center py-20 text-gray-500">Buscando nuevos registros...</div>
  </div>
</div>

<div id="ajustesModal" class="modal-overlay" style="display:none">
  <div class="modal-card p-6">
    <h2 class="text-xl font-black mb-4">⚙️ Ajustes del Sistema</h2>
    
    <div class="space-y-4">
      <div class="p-4 bg-white/5 rounded-xl border border-white/10">
        <label class="text-xs font-bold text-gray-400 block mb-2 uppercase">Ventas de Boletos</label>
        <div class="flex gap-2">
          <button onclick="updateVentas(true)" class="flex-1 py-2 bg-green-500/20 text-green-400 border border-green-500/50 rounded-lg text-xs font-bold">ABRIR</button>
          <button onclick="updateVentas(false)" class="flex-1 py-2 bg-red-500/20 text-red-400 border border-red-500/50 rounded-lg text-xs font-bold">PAUSAR</button>
        </div>
      </div>

      <div class="p-4 bg-red-500/5 rounded-xl border border-red-500/20">
        <label class="text-xs font-bold text-red-400 block mb-1 uppercase">Zona Peligrosa</label>
        <p class="text-[10px] text-gray-500 mb-3">Esto borrará todos los datos para iniciar una nueva rifa.</p>
        <button onclick="resetearSistema()" class="btn-danger w-full py-3 text-sm">🗑️ BORRAR TODO EL SISTEMA</button>
      </div>
    </div>

    <button onclick="cerrarAjustes()" class="w-full mt-6 py-3 text-sm font-bold text-gray-400">CERRAR</button>
  </div>
</div>

<div id="captureModal" class="modal-overlay" style="display:none" onclick="this.style.display='none'">
  <div class="max-w-lg w-full">
    <img id="captureImg" src="" class="w-full rounded-2xl shadow-2xl border-2 border-white/20" />
    <p class="text-center mt-4 text-sm font-bold">Toca afuera para cerrar</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  let orders = [];

  function checkLogin() {
    const pass = document.getElementById('adminPass').value;
    if (pass === 'admin123') { // ◄ Cambia tu clave aquí
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadOrders();
    } else {
      alert("Clave incorrecta");
    }
  }

  async function loadOrders() {
    const { data, error } = await db.from('pedidos').select('*').order('created_at', { ascending: false });
    if (error) { showToast("Error al cargar"); return; }
    orders = data;
    renderOrders();
  }

  function renderOrders() {
    const container = document.getElementById('ordersList');
    document.getElementById('statsInfo').textContent = `${orders.length} pedidos registrados`;
    
    if (orders.length === 0) {
      container.innerHTML = '<div class="text-center py-20 text-gray-500 text-sm italic">No hay pedidos registrados todavía.</div>';
      return;
    }

    container.innerHTML = orders.map(o => {
      const statusColor = o.estado === 'aprobado' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400';
      return `
        <div class="order-card p-4">
          <div class="flex justify-between items-start mb-3">
            <div>
              <div class="font-black text-white">${o.nombre}</div>
              <div class="text-xs text-gray-400">CI: ${o.cedula} | WA: ${o.whatsapp}</div>
            </div>
            <span class="status-badge ${statusColor}">${o.estado}</span>
          </div>
          <div class="bg-black/30 p-3 rounded-xl mb-4 text-[11px] text-orange-200 break-words font-mono">
            ${o.numeros}
          </div>
          <div class="flex gap-2">
            <button onclick="verCapture('${o.capture_url}')" class="flex-1 py-2 bg-white/5 border border-white/10 rounded-lg text-xs font-bold">🖼️ VER CÉDULA</button>
            <button onclick="updateEstado('${o.id}', 'aprobado')" class="flex-1 py-2 bg-green-500 text-black rounded-lg text-xs font-black">APROBAR</button>
            <button onclick="borrarPedido('${o.id}')" class="p-2 bg-red-500/10 text-red-500 rounded-lg">🗑️</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function verCapture(url) {
    document.getElementById('captureImg').src = url;
    document.getElementById('captureModal').style.display = 'flex';
  }

  async function updateEstado(id, estado) {
    const { error } = await db.from('pedidos').update({ estado }).eq('id', id);
    if (error) alert("Error");
    else loadOrders();
  }

  async function borrarPedido(id) {
    if (!confirm("¿Borrar este pedido? Los números se liberarán.")) return;
    await db.from('tickets').delete().eq('pedido_id', id);
    await db.from('pedidos').delete().eq('id', id);
    loadOrders();
  }

  // --- LÓGICA DE BORRADO TOTAL ---
  async function resetearSistema() {
    const confirm1 = confirm("⚠️ ¡PELIGRO! ¿Estás seguro de que quieres borrar TODOS los pedidos y liberar todos los números? Esta acción no se puede deshacer.");
    if (!confirm1) return;

    const confirm2 = prompt("Para confirmar, escribe la palabra: BORRAR");
    if (confirm2 !== "BORRAR") {
      alert("Confirmación incorrecta.");
      return;
    }

    showToast("⏳ Limpiando sistema...", 4000);
    try {
      // 1. Borrar tickets (libera los números)
      await db.from('tickets').delete().not('numero', 'is', null);
      
      // 2. Borrar pedidos
      await db.from('pedidos').delete().not('id', 'is', null);

      showToast("✅ ¡SISTEMA REINICIADO!", 3000);
      cerrarAjustes();
      loadOrders();
    } catch (err) {
      alert("Error al limpiar: " + err.message);
    }
  }

  async function updateVentas(estado) {
    await db.from('landing_config').update({ ventas_activas: estado }).eq('id', 'main');
    showToast(estado ? "✅ Ventas Abiertas" : "🛑 Ventas Pausadas");
  }

  function abrirAjustes() { document.getElementById('ajustesModal').style.display = 'flex'; }
  function cerrarAjustes() { document.getElementById('ajustesModal').style.display = 'none'; }
  
  function showToast(msg, dur = 2000) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), dur);
  }
</script>

</body>
</html>
